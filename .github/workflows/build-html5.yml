name: Build Bloodbath Spanish Mix HTML5

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Release tag holding bloodbath-spanish-mix-source.zip
        required: true
        default: source-v1.0.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spanishversthpbb-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned Psych Engine 0.7.3 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Install browser build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Psych Engine 0.7.3 libraries
        run: |
          set -euo pipefail
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install tjson
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc

      - name: Download the supplied mod archive from this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download "$SOURCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bloodbath-spanish-mix-source.zip" \
            --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/bloodbath-spanish-mix-source.zip"

      - name: Embed mod data and apply HTML5 compatibility port
        run: |
          set -euo pipefail
          python3 -m py_compile tools/prepare_html5.py
          python3 tools/prepare_html5.py \
            --engine PsychEngine \
            --package "$RUNNER_TEMP/source/bloodbath-spanish-mix-source.zip" \
            --report "$RUNNER_TEMP/html5-build-report.json"

      - name: Compile Psych Engine 0.7.3 for HTML5
        working-directory: PsychEngine
        run: haxelib run lime build html5 -release

      - name: Assemble browser site
        run: |
          set -euo pipefail
          WEB_DIR="$(find PsychEngine/export/release -type f -name index.html -printf '%h\n' -quit)"
          if [ -z "$WEB_DIR" ]; then
            echo "The Haxe compile did not produce index.html." >&2
            find PsychEngine/export/release -maxdepth 5 -type f | head -100
            exit 1
          fi
          mkdir -p _site
          cp -a "$WEB_DIR/." _site/
          cp "$RUNNER_TEMP/html5-build-report.json" _site/BUILD-REPORT.json
          touch _site/.nojekyll
          SITE_BYTES="$(du -sb _site | cut -f1)"
          echo "HTML5 site size: $SITE_BYTES bytes"
          if [ "$SITE_BYTES" -gt 1073741824 ]; then
            echo "The generated site exceeds GitHub Pages' 1 GB published-site limit." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML5 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser build
        id: deployment
        uses: actions/deploy-pages@v4
