name: Build Bloodbath Spanish Mix HTML5

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Release tag holding bloodbath-spanish-mix-source.zip
        required: true
        default: source-v1.0.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spanishversthpbb-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned Psych Engine 0.7.3 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.2

      - name: Set up Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Psych Engine 0.7.3 libraries
        run: |
          set -euo pipefail
          # Match the Psych Engine source's required Flixel APIs.
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-ui 2.5.0 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install tjson 1.4.0 --always
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev

      - name: Verify Psych Engine HaxeFlixel APIs
        run: |
          set -euo pipefail
          FLIXEL_PATH="$(haxelib path flixel | head -n 1)"
          ADDONS_PATH="$(haxelib path flixel-addons | head -n 1)"
          test -f "$FLIXEL_PATH/flixel/sound/FlxSound.hx"
          test -f "$ADDONS_PATH/flixel/addons/display/FlxRuntimeShader.hx"
          grep -q "animationTimeScale" "$FLIXEL_PATH/flixel/FlxG.hx"
          grep -q "public var timeScale" "$FLIXEL_PATH/flixel/animation/FlxAnimationController.hx"
          grep -q "public var filters" "$FLIXEL_PATH/flixel/FlxCamera.hx"
          haxelib list

      - name: Download the supplied mod archive from this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag || 'source-v1.0.0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download "$SOURCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bloodbath-spanish-mix-source.zip" \
            --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/bloodbath-spanish-mix-source.zip"

      - name: Embed mod data and apply HTML5 compatibility port
        run: |
          set -euo pipefail
          python3 -m py_compile tools/prepare_html5.py
          python3 tools/prepare_html5.py \
            --engine PsychEngine \
            --package "$RUNNER_TEMP/source/bloodbath-spanish-mix-source.zip" \
            --report "$RUNNER_TEMP/html5-build-report.json"

      - name: Compile Psych Engine 0.7.3 for HTML5
        working-directory: PsychEngine
        run: haxelib run lime build html5 -release

      - name: Assemble browser site
        run: |
          set -euo pipefail
          WEB_DIR="$(find PsychEngine/export/release -type f -name index.html -printf '%h\n' -quit)"
          if [ -z "$WEB_DIR" ]; then
            echo "The Haxe compile did not produce index.html." >&2
            find PsychEngine/export/release -maxdepth 5 -type f | head -100
            exit 1
          fi
          mkdir -p _site
          cp -a "$WEB_DIR/." _site/
          cp "$RUNNER_TEMP/html5-build-report.json" _site/BUILD-REPORT.json

          # Show uncaught browser exceptions on top of the game canvas.
          # This is especially useful for HTML5-only asset/runtime failures,
          # which otherwise leave the player with a silent black screen.
          python3 - <<'PY'
          from pathlib import Path

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          marker = "HTML5 runtime diagnostics overlay"
          if marker not in html:
              diagnostic = r"""
          <script>
          // HTML5 runtime diagnostics overlay
          (function () {
              var reported = 0;
              function report(title, details) {
                  try {
                      var panel = document.getElementById("html5-runtime-diagnostics");
                      if (!panel) {
                          panel = document.createElement("div");
                          panel.id = "html5-runtime-diagnostics";
                          panel.style.cssText = "position:fixed;z-index:2147483647;top:8px;left:8px;right:8px;max-height:42vh;overflow:auto;background:rgba(35,0,0,.96);border:2px solid #ff5959;border-radius:6px;color:#fff;padding:12px;font:12px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 12px #000";
                          document.body.appendChild(panel);
                      }
                      var item = document.createElement("pre");
                      item.style.cssText = "margin:0 0 8px;padding:0;color:#fff;white-space:pre-wrap;font:inherit";
                      item.textContent = title + "\n" + String(details || "No additional details");
                      panel.appendChild(item);
                      reported++;
                      if (reported > 12) panel.removeChild(panel.children[1]);
                  } catch (_) {}
              }
              window.addEventListener("error", function (event) {
                  if (event instanceof ErrorEvent) {
                      report("JavaScript runtime error", (event.message || "Unknown error") +
                          (event.filename ? "\nFile: " + event.filename : "") +
                          (event.lineno ? "\nLine: " + event.lineno + ":" + (event.colno || 0) : "") +
                          (event.error && event.error.stack ? "\n\n" + event.error.stack : ""));
                  }
              }, true);
              window.addEventListener("unhandledrejection", function (event) {
                  var reason = event.reason;
                  report("Unhandled promise rejection", reason && reason.stack ? reason.stack : reason);
              });
              var originalError = console.error;
              console.error = function () {
                  try { report("Console error", Array.prototype.slice.call(arguments).map(function (x) {
                      return x && x.stack ? x.stack : String(x);
                  }).join("\n")); } catch (_) {}
                  return originalError.apply(console, arguments);
              };
          })();
          </script>
          """
              script_marker = '<script type="text/javascript" src="./PsychEngine.js"></script>'
              if script_marker not in html:
                  raise SystemExit("Cannot locate PsychEngine.js script tag to install diagnostics.")
              html = html.replace(script_marker, diagnostic + "\n" + script_marker, 1)
              page.write_text(html, encoding="utf-8")
          PY

          touch _site/.nojekyll
          SITE_BYTES="$(du -sb _site | cut -f1)"
          echo "HTML5 site size: $SITE_BYTES bytes"
          if [ "$SITE_BYTES" -gt 1073741824 ]; then
            echo "The generated site exceeds GitHub Pages' 1 GB published-site limit." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML5 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser build
        id: deployment
        uses: actions/deploy-pages@v4
